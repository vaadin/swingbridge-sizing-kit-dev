# JVM flags for launching the customer's skeleton-starter jar under a sizing run.
#
# One argv ENTRY per line -- not one flag: `--patch-module java.desktop=...` is two
# entries, `-Xbootclasspath/a:...` is one. Blank lines and # comments are skipped.
# @LOCAL_REPO@ and @SB_VERSION@ are rendered by captureServerArgv.sh from the clone's
# pom (settings.localRepository, swing-bridge.version), the same two values the
# skeleton README tells a developer to substitute by hand.
#
# This is skeleton-starter-vaadin-swing-bridge's spring-boot:run <jvmArguments> set,
# minus the debug agent. In production those pom flags do not apply, so the kit
# carries them here; checkEnv.sh warns when the clone's pom drifts from this list.
# --add-opens=java.base/java.lang is load-bearing: the bridge's per-tenant thread
# group fails fast by name without it.
--patch-module
java.desktop=@LOCAL_REPO@/com/vaadin/swing-bridge-patch/@SB_VERSION@/swing-bridge-patch-@SB_VERSION@.jar
-Xbootclasspath/a:@LOCAL_REPO@/com/vaadin/swing-bridge-graphics/@SB_VERSION@/swing-bridge-graphics-@SB_VERSION@.jar
--add-reads=java.desktop=ALL-UNNAMED
--add-exports=java.desktop/sun.font=ALL-UNNAMED
--add-exports=java.desktop/sun.awt=ALL-UNNAMED
--add-exports=java.desktop/sun.awt.dnd=ALL-UNNAMED
--add-exports=java.desktop/sun.awt.dnd.peer=ALL-UNNAMED
--add-exports=java.base/sun.nio.cs=ALL-UNNAMED
--add-exports=java.desktop/sun.java2d=ALL-UNNAMED
--add-exports=java.desktop/sun.java2d.pipe=ALL-UNNAMED
--add-exports=java.desktop/sun.awt.datatransfer=ALL-UNNAMED
--add-exports=java.desktop/sun.awt.image=ALL-UNNAMED
--add-exports=java.desktop/java.awt.peer=ALL-UNNAMED
--add-exports=java.desktop/java.awt.dnd=ALL-UNNAMED
--add-exports=java.desktop/java.awt.dnd.peer=ALL-UNNAMED
--add-exports=java.desktop/sun.print=ALL-UNNAMED
--add-exports=java.desktop/sun.swing=ALL-UNNAMED
--add-opens=java.desktop/java.awt.event=ALL-UNNAMED
--add-opens=java.desktop/sun.awt=ALL-UNNAMED
--add-opens=java.desktop/java.awt.dnd=ALL-UNNAMED
--add-opens=java.base/java.lang=ALL-UNNAMED
